<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIXIU · 刺绣工坊 — 二维码</title>
<style>
  :root {
    --bg: #1a1410;
    --bg-2: #241d16;
    --gold: #c9a96e;
    --gold-bright: #e8d5a3;
    --red: #c0392b;
    --text: #e0d5c1;
    --text-dim: #8a7f6e;
    --border: rgba(201,169,110,0.2);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image: 
      radial-gradient(ellipse at 30% 20%, rgba(201,169,110,0.04), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(192,57,43,0.03), transparent 50%);
  }
  .container {
    max-width: 920px;
    width: 100%;
  }
  .header {
    text-align: center;
    margin-bottom: 50px;
  }
  .header h1 {
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  .header p {
    color: var(--text-dim);
    font-size: 0.95rem;
    letter-spacing: 2px;
  }
  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 15px auto 0;
  }
  .qr-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  @media (max-width: 720px) {
    .qr-grid { grid-template-columns: 1fr; }
  }
  .qr-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .qr-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .qr-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: 0 12px 40px rgba(201,169,110,0.1);
  }
  .qr-card:hover::before { opacity: 1; }
  .qr-card .tag {
    display: inline-block;
    font-size: 0.75rem;
    color: var(--gold);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 14px;
    margin-bottom: 18px;
    letter-spacing: 2px;
  }
  .qr-card h3 {
    font-size: 1.15rem;
    color: var(--gold-bright);
    margin-bottom: 20px;
    letter-spacing: 3px;
  }
  .qr-card img {
    width: 200px;
    height: 200px;
    border-radius: 8px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    transition: transform 0.3s;
  }
  .qr-card:hover img {
    transform: scale(1.03);
  }
  .qr-card .url {
    font-size: 0.72rem;
    color: var(--text-dim);
    word-break: break-all;
    line-height: 1.5;
    font-family: 'Courier New', monospace;
  }
  .footer {
    text-align: center;
    margin-top: 50px;
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>刺 绣 工 坊</h1>
    <p>扫码体验 · CIXIU</p>
    <div class="divider"></div>
  </div>
  <div class="qr-grid">
    <div class="qr-card">
      <span class="tag">首页</span>
      <h3>项目入口</h3>
      <img src="qr-index.png" alt="首页二维码">
      <div class="url">https://123456xsggd.github.io/CIXIU/</div>
    </div>
    <div class="qr-card">
      <span class="tag">工坊</span>
      <h3>手势绣花</h3>
      <img src="qr-workshop.png" alt="工坊二维码">
      <div class="url">https://123456xsggd.github.io/CIXIU/workshop.html</div>
    </div>
    <div class="qr-card">
      <span class="tag">作品集</span>
      <h3>项目展示</h3>
      <img src="qr-portfolio.png" alt="作品集二维码">
      <div class="url">https://123456xsggd.github.io/CIXIU/portfolio.html</div>
    </div>
  </div>
  <div class="footer">— CIXIU · 手势交互刺绣工坊 —</div>
</div>
</body>
</html>
